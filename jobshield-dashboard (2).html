<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>JobShield AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky instrument header (brand, four views, backend status) over a single
   1120px column; the Analyze view is a two-pane workbench that stacks on phones. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0f1722;
  --ink-2: #434e5d;
  --ink-3: #667181;
  --line: #d5dbe4;
  --accent: #2b3fbf;
  --accent-ink: #ffffff;
  --legit: #0b6e99;
  --legit-tint: #e2f0f6;
  --fraud: #c2410c;
  --fraud-tint: #fbe8df;
  --warn: #7a5200;
  --warn-tint: #fcf1d2;

  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-base: 0.9375rem;
  --fs-md: 1.0625rem;
  --fs-lg: 1.375rem;
  --fs-xl: 1.875rem;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #151b24; --surface-2: #1b232e;
    --ink: #e8edf4; --ink-2: #aeb8c6; --ink-3: #8691a0; --line: #2b3542;
    --accent: #93a5ff; --accent-ink: #0d1117;
    --legit: #3a94bd; --legit-tint: #12303d;
    --fraud: #e06c33; --fraud-tint: #3a2015;
    --warn: #f0c060; --warn-tint: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1b232e;
  --ink: #e8edf4; --ink-2: #aeb8c6; --ink-3: #8691a0; --line: #2b3542;
  --accent: #93a5ff; --accent-ink: #0d1117;
  --legit: #3a94bd; --legit-tint: #12303d;
  --fraud: #e06c33; --fraud-tint: #3a2015;
  --warn: #f0c060; --warn-tint: #33290f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.55;
}
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1120px; margin: 0 auto; padding: 10px 16px 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-md); letter-spacing: 0.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--ink-3); }
.status {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface-2); font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer;
}
.status-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 2px solid var(--ink-3); }
.status[data-state="ok"] .status-dot { background: var(--legit); border-color: var(--legit); }
.status[data-state="error"] .status-dot { background: var(--fraud); border-color: var(--fraud); border-radius: 1px; }
.status[data-state="testing"] .status-dot { border-style: dashed; }
.nav { display: flex; gap: 4px; width: 100%; overflow-x: auto; }
.nav button {
  background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer;
  padding: 8px 12px 9px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- page ---------- */
.page { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 40px; }
.section { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-lg); line-height: 1.2; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); line-height: 1.3; }
.lede { max-width: 65ch; color: var(--ink-2); font-size: var(--fs-md); }
.note { max-width: 70ch; color: var(--ink-2); font-size: var(--fs-sm); }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card-stack { display: flex; flex-direction: column; gap: 16px; }
#prediction, #connection { scroll-margin-top: 120px; }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-label { font-size: var(--fs-sm); color: var(--ink-2); }
.tile-value { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: var(--fs-sm); color: var(--ink-3); }

/* ---------- proportion bar ---------- */
.propbar { display: flex; gap: 2px; height: 18px; }
.propbar span { display: block; height: 100%; min-width: 4px; }
.propbar span:first-child { border-radius: 4px 0 0 4px; }
.propbar span:last-child { border-radius: 0 4px 4px 0; }
.sw-legit { background: var(--legit); }
.sw-fraud { background: var(--fraud); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: var(--fs-sm); color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.legend b { color: var(--ink); font-weight: 600; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
th, td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tbody th { font-weight: 500; }
td { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.picked th, tr.picked td { background: var(--surface-2); font-weight: 600; }
.tag { display: inline-block; margin-left: 8px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--font-body); font-size: var(--fs-xs); font-weight: 500; color: var(--ink-2); }

/* ---------- pipeline ---------- */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
.pipeline li { counter-increment: step; border-top: 2px solid var(--ink); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pipeline li::before { content: counter(step); font-family: var(--font-data); font-size: var(--fs-xs); color: var(--ink-3); }
.pipeline b { font-weight: 600; }
.pipeline span { font-size: var(--fs-sm); color: var(--ink-2); }

/* ---------- confusion matrix ---------- */
.cm { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 6px; max-width: 620px; }
.cm-head { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); padding: 4px 8px; align-self: end; }
.cm-row { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); padding: 8px 8px 8px 0; align-self: center; max-width: 9.5em; }
.cm-row small { display: block; font-weight: 400; color: var(--ink-3); }
.cm-cell { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cm-cell[data-kind="error"] { background: var(--warn-tint); border-color: transparent; }
.cm-count { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); line-height: 1.1; font-variant-numeric: tabular-nums; }
.cm-name { font-size: var(--fs-sm); color: var(--ink-2); }

/* ---------- workbench ---------- */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.conn { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: var(--fs-sm); font-weight: 600; }
.field label em { font-style: normal; font-weight: 400; color: var(--ink-3); }
.field input, .field textarea {
  width: 100%; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.field textarea { resize: vertical; min-height: 5.2em; line-height: 1.45; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field[data-invalid="true"] input, .field[data-invalid="true"] textarea { border-color: var(--fraud); }
.field-foot { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-xs); color: var(--ink-3); }
.field-err { color: var(--ink); font-weight: 500; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { border-radius: var(--radius); padding: 10px 12px; font-size: var(--fs-sm); background: var(--surface-2); color: var(--ink-2); }
.msg b { color: var(--ink); }
.msg[data-tone="warn"] { background: var(--warn-tint); color: var(--ink); }
.msg[data-tone="ok"] { background: var(--legit-tint); color: var(--ink); }
.msg[data-tone="error"] { background: var(--fraud-tint); color: var(--ink); }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.empty b { color: var(--ink); font-family: var(--font-display); font-size: var(--fs-md); font-weight: 600; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--line); border-left-color: var(--accent); } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--ink-2); padding: 24px 18px; border: 1px dashed var(--line); border-radius: var(--radius); }

.verdict { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius); }
.verdict[data-label="Fraudulent"] { background: var(--fraud-tint); }
.verdict[data-label="Legitimate"] { background: var(--legit-tint); }
.verdict svg { flex: none; }
.verdict[data-label="Fraudulent"] svg { color: var(--fraud); }
.verdict[data-label="Legitimate"] svg { color: var(--legit); }
.verdict-label { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); line-height: 1.1; }
.verdict-meta { font-size: var(--fs-sm); color: var(--ink-2); }

/* decision-score axis */
.axis { position: relative; height: 96px; margin-top: 4px; }
.axis-track { position: absolute; left: 0; right: 0; top: 34px; height: 20px; display: flex; gap: 2px; }
.axis-track span { flex: 1; }
.axis-track span:first-child { background: var(--legit-tint); border-radius: 4px 0 0 4px; }
.axis-track span:last-child { background: var(--fraud-tint); border-radius: 0 4px 4px 0; }
.axis-tick { position: absolute; top: 30px; height: 28px; width: 1px; background: var(--ink-3); transform: translateX(-0.5px); }
.axis-tick[data-zero="true"] { width: 2px; background: var(--ink); transform: translateX(-1px); }
.axis-ticklabel { position: absolute; top: 61px; transform: translateX(-50%); font-family: var(--font-data); font-size: var(--fs-xs); color: var(--ink-2); }
.axis-pin { position: absolute; top: 26px; height: 36px; width: 4px; border-radius: 2px; transform: translateX(-2px); box-shadow: 0 0 0 2px var(--surface); }
.axis-pin[data-label="Fraudulent"] { background: var(--fraud); }
.axis-pin[data-label="Legitimate"] { background: var(--legit); }
.axis-bubble { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-data); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.axis-sides { position: absolute; left: 0; right: 0; top: 78px; display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--ink-3); }

.sum { width: 100%; font-size: var(--fs-sm); }
.sum th, .sum td { border-bottom: 1px solid var(--line); padding: 7px 0; white-space: normal; }
.sum th { font-weight: 400; color: var(--ink-2); text-align: left; }
.sum tr:last-child th, .sum tr:last-child td { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 600; color: var(--ink); }

.terms { display: flex; flex-direction: column; gap: 8px; }
.term { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.term-name { font-weight: 500; overflow-wrap: anywhere; }
.term-val { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: var(--fs-sm); }
.term-bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.term-bar i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; }
.term-math { grid-column: 1 / -1; font-family: var(--font-data); font-size: var(--fs-xs); color: var(--ink-3); }
.evidence { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.evidence h3 { display: flex; align-items: center; gap: 8px; font-size: var(--fs-base); }
.evidence h3 i { width: 10px; height: 10px; border-radius: 2px; flex: none; }

.limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.limits li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.limits b { font-weight: 600; }
.limits span { font-size: var(--fs-sm); color: var(--ink-2); }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 20px; font-size: var(--fs-sm); max-width: 70ch; }
.facts dt { color: var(--ink-3); }
.facts dd { color: var(--ink); overflow-wrap: anywhere; }
.foot { font-size: var(--fs-xs); color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; max-width: 80ch; }

/* ---------- motion ---------- */
.reveal { animation: rise 0.35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.axis-pin, .axis-bubble { transition: left 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
.term-bar i, .fc-track i { transition: width 0.5s ease; }
.hist-bin i { transition: height 0.5s ease; }
@media (prefers-reduced-motion: reduce) {
  .reveal { animation: none; }
  .axis-pin, .axis-bubble, .term-bar i, .fc-track i, .hist-bin i { transition: none; }
}

/* ---------- connection strip, reason line, form actions ---------- */
.btn-small { padding: 5px 10px; font-size: var(--fs-sm); }
.connbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: var(--fs-sm); color: var(--ink-2); }
.connbar-text { flex: 1; min-width: 12em; }
.connbar-text b { color: var(--ink); font-weight: 600; }
.status-dot[data-on="true"] { background: var(--legit); border-color: var(--legit); }
.reason { color: var(--ink-2); }
.reason b { color: var(--ink); font-weight: 600; }
.form-actions { display: flex; align-items: center; gap: 12px; }
.hint { font-size: var(--fs-xs); color: var(--ink-3); }

/* ---------- post-analysis charts ---------- */
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.tip { position: fixed; z-index: 30; transform: translate(-50%, calc(-100% - 8px)); max-width: 240px; padding: 6px 9px; border-radius: var(--radius); background: var(--ink); color: var(--bg); font-size: var(--fs-xs); line-height: 1.4; pointer-events: none; }
.sw-known { background: var(--ink-2); }
.sw-unknown { background: var(--line); }
.more summary { cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); }
.more[open] summary { margin-bottom: 8px; }

.fc { display: flex; flex-direction: column; }
.fc-head, .fc-row { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 4.6em; gap: 4px 12px; align-items: center; }
.fc-head { padding-bottom: 4px; }
.fc-sides { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--ink-3); }
.fc-row { padding: 7px 0; border-top: 1px solid var(--line); }
.fc-row[data-total="true"] { border-top: 2px solid var(--ink); font-weight: 600; }
.fc-label { display: flex; flex-direction: column; min-width: 0; font-size: var(--fs-sm); }
.fc-label span { font-weight: 500; }
.fc-row[data-total="true"] .fc-label span { font-weight: 600; }
.fc-label small { font-size: var(--fs-xs); color: var(--ink-3); }
.fc-track { position: relative; height: 14px; }
.fc-track::before { content: ""; position: absolute; left: 50%; top: -7px; bottom: -7px; width: 1px; background: var(--ink-3); }
.fc-track i { position: absolute; top: 0; height: 100%; min-width: 2px; }
.fc-track i[data-dir="right"] { left: 50%; margin-left: 1px; border-radius: 0 4px 4px 0; }
.fc-track i[data-dir="left"] { right: 50%; margin-right: 1px; border-radius: 4px 0 0 4px; }
.fc-total { background: var(--ink); }
.fc-val { text-align: right; font-family: var(--font-data); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }

.ref { display: flex; flex-direction: column; gap: 8px; }
.ref-group { display: flex; flex-direction: column; gap: 4px; }
.ref-title { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 500; }
.ref-title i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.ref-title .num { color: var(--ink-3); font-weight: 400; }
.ref-flag { position: relative; height: 20px; }
.ref-flag span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-data); font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.hist-wrap { position: relative; height: 72px; border-bottom: 1px solid var(--line); }
.hist { display: flex; gap: 2px; height: 100%; }
.hist[data-dense="true"] { gap: 1px; }
.hist-bin { flex: 1; min-width: 0; display: flex; align-items: flex-end; }
.hist-bin:hover { background: var(--surface-2); }
.hist-bin i { display: block; width: 100%; border-radius: 2px 2px 0 0; }
.hist-bin i[data-any="true"] { min-height: 2px; }
.hist-zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-3); transform: translateX(-0.5px); pointer-events: none; }
.hist-mark { position: absolute; top: -4px; bottom: 0; width: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-1px); pointer-events: none; }
.ref-axis { position: relative; height: 16px; }
.ref-axis span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-data); font-size: var(--fs-xs); color: var(--ink-2); }

@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bench, .evidence, .limits { grid-template-columns: minmax(0, 1fr); }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .conn { grid-template-columns: minmax(0, 1fr); }

    var formState = useState(EXAMPLES.suspicious), form = formState[0], setForm = formState[1];
    var exState = useState(true), exampleLoaded = exState[0], setExampleLoaded = exState[1];

    function setApiUrl(v) { setApiUrlRaw(v); store("local", "jobshield.apiUrl", v); setUrlError(""); setConn({ state: "idle" }); }
    function setToken(v) { setTokenRaw(v); store("local", "jobshield.token", v); setConn({ state: "idle" }); }

      callApi(base, token.trim(), "/predict", body).then(function (payload) {
        if (!looksLikePrediction(payload)) throw { title: "Unexpected reply", text: "The backend answered, but not with a prediction in the expected format. Check that the API cell in Colab is the current version." };

        setRequest({ status: "success", data: payload, at: now(), id: requestCount.current });

    var page =
      view === "analyze" ? h(Analyze, { conn: conn, request: request, stale: stale, apiUrl: apiUrl, token: token, urlError: urlError, form: form, errors: errors, exampleLoaded: exampleLoaded, setApiUrl: setApiUrl, setToken: setToken, setField: setField, load: load, testConnection: testConnection, analyze: analyze, connOpen: connOpen, setConnOpen: setConnOpen, forget: forget }) :
      view === "performance" ? h(Performance) :

      h("header", { className: "top" },
        h("div", { className: "top-in" },
          h("div", { className: "brand" },
            h(Icon, { name: "shield", size: 28, outline: true }),
            h("div", null, h("div", { className: "brand-name" }, "JobShield AI"), h("div", { className: "brand-sub" }, "Job posting fraud screening"))),
          h("button", { className: "status", "data-state": conn.state, type: "button", onClick: function () { go("analyze"); setConnOpen(true); }, title: "Open backend connection settings" },
            h("span", { className: "status-dot" }), statusText),
          h("nav", { className: "nav", "aria-label": "Sections" },
            VIEWS.map(function (v) { return h("button", { key: v[0], type: "button", "aria-current": view === v[0] ? "page" : null, onClick: function () { go(v[0]); } }, v[1]); })))),
      h("main", { className: "page" },

  }
